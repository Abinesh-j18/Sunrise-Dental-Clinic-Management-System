name: Sunrise Dental CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: sunrisedb
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install MySQL Client & Initialize Database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          mysql -h 127.0.0.1 -P 3306 -u root --protocol=tcp sunrisedb < database/schema.sql

      - name: Run Automated JUnit Test Suite (CI)
        run: mvn clean test --batch-mode

      - name: Package Executable Application JAR (CD)
        run: mvn package -DskipTests --batch-mode

      - name: Upload Application Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunriseDentalClinic-v1.0-Distribution
          path: target/*.jar
          retention-days: 30
